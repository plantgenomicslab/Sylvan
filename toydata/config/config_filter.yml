###############################################################################################
#
# Input
# [Required] Provide input to GeneModelFilter
#
###############################################################################################

Singularity: singularity/sylvan.sif      # Singularity image (pre-built micromamba environments inside)

Input:
  genome: results/GETA/genome.fasta            # [path] genome fasta file (GETA/genome.fasta)
  rna_seq: toydata/RNASeq                      # [path] Directory with paired-end RNAseq data
  protein: results/PROTEIN/merged_rmdup_proteins.fasta  # [path] Homolg protein file (PROTEIN/merged_rmdup_proteins.fasta)
  anot_gff: results/PREFILTER/Sylvan.gff3      # [path] Annotated gff (PREFILTER/Sylvan.gff3)
  augustus_gff: results/GETA/Augustus/augustus.gff3     # [path] Augustus annotation (GETA/Augustus/augustus.gff3)
  helixer_gff: results/AB_INITIO/Helixer/helixer.gff3   # [path] Helixer annotation (AB_INITIO/Helixer/helixer.gff3)
  repeat_gff: results/GETA/RepeatMasker/genome.repeat.gff3 # [path] Repeat annotation
  miniprot_gff: results/PROTEIN/merged_rmdup_proteins.fasta.miniprot.clean.gff3  # [path] Miniprot protein alignment GFF3
  HmmDB: /usr/local/src                        # [path] PFAM directory for pfam scanning (contains Pfam-A.hmm files)
  RexDB: toydata/misc/Viridiplantae_v4.0.fasta # [path] RexDB protein FASTA for retroelement filtering
                                               # Download from: https://raw.githubusercontent.com/repeatexplorer/rexdb/refs/heads/main/Viridiplantae_v4.0.fasta
                                               # Example: wget -O toydata/misc/Viridiplantae_v4.0.fasta https://raw.githubusercontent.com/repeatexplorer/rexdb/refs/heads/main/Viridiplantae_v4.0.fasta
  busco_lin: eudicots_odb10                    # [string] Busco lineage to use for filter monitoring (e.g. eudicots_odb10)
  chrom_regex: (^Chr)|(^chr)|(^LG)|(^Ch)|(^\d) # [string] Regex string capturing the prefix of all chromosomes in the genome file

###############################################################################################
#
# Benchmark — GFF3 files to evaluate with BUSCO + OMArk
# omark_db is empty by default to explicitly skip OMArk; set it to an existing
# OMAmer database file to opt in (Viridiplantae is sufficient for plants).
#
###############################################################################################

Benchmark:
  omark_db: ""                            # [path] Empty explicitly disables OMArk
  gff3_files:
    augustus: results/GETA/Augustus/augustus.gff3
    helixer: results/AB_INITIO/Helixer/helixer.gff3
    liftoff: results/LIFTOVER/LiftOff/liftoff.gff3
    geta: results/GETA/geta.geneModels.gff3
    geta_best: results/GETA/geta.bestGeneModels.gff3
    miniprot: results/PROTEIN/merged_rmdup_proteins.fasta.miniprot.clean.gff3
    evm: results/EVM/EVM.all.gff3
    sylvan_prefilter: results/PREFILTER/Sylvan.gff3
    sylvan_filtered: results/FILTER/filtered.gff3

###############################################################################################
#
# Filter Configuration
# [Optional] Configure GeneModelFilter
#
###############################################################################################

Cutoff:
  tpm: 3                   # Expression cutoff threshold (keep genes greater than)
  rsem_cov: 0.5            # RSEM coverage cutoff (keep genes greater than)
  blast_pident: 0.6        # Blast percent identity (default: 0.6) (keep genes greater than)
  blast_qcovs: 0.6         # Blast query coverage (default: 0.6) (keep genes greater than)
  rex_pident: 0.6          # RexDB blast percent identity (default: 0.6) (keep genes less than)
  rex_qcovs: 0.6           # RexDB blast query coverage (default: 0.6) (keep genes less than)
  helixer_cov: 0.8         # Helixer coverage cutoff (keep genes greater than)
  augustus_cov: 0.8        # Augustus coverage cutoff (keep genes greater than)
  repeat_cov: 0.5          # Repeat coverage cutoff (keep genes less than)

###############################################################################################
#
# Per-rule resource allocation (threads used by Snakefiles)
#
# SLURM submission settings (account, partition, resources) are in a separate file:
#   cluster_filter.yml  (used by filter_toydata.sh as --cluster-config)
#
# [Optional] modify resource allocation and threading for specific processes
#
###############################################################################################
 
Threads:
  PfamScan: 48
  sortSTAR: 16
  blast: 16
  fastp_PAIRED: 16
  prepRSEM: 16
  STAR: 12
  mergeSTAR: 16
  calculateRSEMExpression_PAIRED: 16
  calculateRSEMExpression_SINGLE: 16
  busco: 4
  lncRNA_pred: 24
  STAR_index: 12


__default__:
  account: cpu-s1-pgl-0    # SLURM account (e.g., cpu-s1-pgl-0). Set to "" if not required.
  partition: cpu-s1-pgl-0  # SLURM partition (e.g., cpu-s1-pgl-0). Set to "" if not required.
  memory: 16g
  name: "{rule}.{wildcards}"
  ncpus: 4
  nodes: 1
  time: "7-00:00:00"
  output: results/logs/{rule}_{wildcards}.out
  error: results/logs/{rule}_{wildcards}.err
  extra_args: ""                          # Extra sbatch flags (e.g., "--export=ALL")

# Per-rule SLURM blocks used to live here as well. This file is the pipeline
# config (SYLVAN_FILTER_CONFIG); the scheduler reads cluster_filter.yml
# (SYLVAN_FILTER_CLUSTER_CONFIG), so those blocks were never applied and four of
# them named rules that no longer exist (RSEM, indexRef, STAR_generate,
# calculateRSEMExpression). Removed so there is one place to change an
# allocation. See test/check_cluster_config.py (#14).
